<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nasheed Player</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#121212">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#1db954" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#1db954"/><path d="M12 2a10 10 0 0 1 0 20" stroke="#1db954" stroke-width="2" opacity="0.4"/></svg>
        <span>Nasheed</span>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Search
      </button>
      <button class="nav-btn" data-view="library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Library
      </button>
      <button class="nav-btn" data-view="favorites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Favorites
      </button>
      <button class="nav-btn" data-view="downloads">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Downloads
      </button>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="playlists-header">
      <span>PLAYLISTS</span>
      <button id="add-playlist-btn" class="icon-btn-sm">+</button>
    </div>
    <div id="playlist-nav"></div>
  </aside>

  <main id="main">
    <div id="search-view" class="view active">
      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="What do you want to listen to?" autofocus>
      </div>
      <div id="search-status" class="status-bar"></div>
      <div id="search-empty" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>Search for nasheeds</p>
        <span>Type a name, artist, or keyword</span>
      </div>
      <div id="search-loading" class="empty-state" style="display:none">
        <div class="spinner"></div>
        <p>Searching YouTube...</p>
      </div>
      <div id="search-results" class="song-list" style="display:none"></div>
    </div>

    <div id="library-view" class="view">
      <div class="view-header">
        <h1 id="lib-title">My Library</h1>
        <span id="lib-subtitle" class="subtitle"></span>
      </div>
      <div id="lib-empty" class="empty-state" style="display:none">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p>Library is empty</p>
        <span>Search and add nasheeds</span>
      </div>
      <div id="lib-list" class="song-list" style="display:none"></div>
    </div>
  </main>
</div>

<div id="player">
  <div class="player-left">
    <img id="player-thumb" src="" alt="">
    <div id="player-thumb-placeholder">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="player-info">
      <div id="player-title">No track playing</div>
      <div id="player-artist"></div>
    </div>
    <button id="player-fav-btn" class="icon-btn" title="Favorite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button id="loop-btn" class="icon-btn" title="Loop">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button id="prev-btn" class="icon-btn" title="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="play-btn" class="play-btn" title="Play">
        <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="stop-btn" class="icon-btn" title="Stop">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      </button>
      <button id="next-btn" class="icon-btn" title="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 18l8.5-6L4 6z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span id="time-pos" class="time">0:00</span>
      <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
      <span id="time-dur" class="time">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button id="vol-btn" class="icon-btn" title="Volume">
      <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
    <input type="range" id="volume-bar" min="0" max="100" value="70">
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
