<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;background:#0f1311;color:#e8ebe8;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:
    radial-gradient(42rem 30rem at 12% -6%,rgba(29,185,84,.14),transparent 60%),
    radial-gradient(38rem 28rem at 108% 110%,rgba(201,168,108,.10),transparent 60%);pointer-events:none}
  .box{text-align:center;padding:0 24px;animation:in .5s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .logo{width:104px;height:104px;border-radius:24px;display:block;margin:0 auto 22px;box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
  .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.12);border-top-color:#1db954;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 18px}
  @keyframes s{to{transform:rotate(360deg)}}
  #msg{color:#a7a7a7;font-size:13px;line-height:1.5;margin:0;max-width:280px}
  #msg.err{color:#e8b4a0}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="app_logo.png" alt="Quran">
  <div class="spin" id="spin"></div>
  <p id="msg">Starting Quran…</p>
</div>
<script>
  var tries = 0;
  (function poll() {
    fetch('http://127.0.0.1:5000/', { mode: 'no-cors' })
      .then(function () { location.replace('http://127.0.0.1:5000/'); })
      .catch(function () {
        if (++tries < 120) {
          setTimeout(poll, 250);
        } else {
          document.getElementById('spin').style.display = 'none';
          var msg = document.getElementById('msg');
          msg.className = 'err';
          msg.textContent =
            'Could not reach the local server: is Python, flask, and yt-dlp installed?';
        }
      });
  })();
</script>
</body>
</html>
