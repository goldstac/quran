name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
            tauri-bundles: appimage,deb
          - os: macos-latest
            name: macos
            target: aarch64-apple-darwin
            tauri-bundles: dmg
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
            tauri-bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Python build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript deps
        shell: bash
        run: npm ci

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked

      - name: Build backend sidecar
        shell: bash
        run: |
          python build-backend-sidecar.py
          python build-ytdlp-sidecar.py
          echo "Built sidecars"
          ls -R dist

      - name: Stage sidecars for Tauri
        shell: bash
        run: |
          mkdir -p tauri-app/src-tauri/bin
          cp dist/quran-backend-${{ matrix.target }} tauri-app/src-tauri/bin/ || true
          cp dist/quran-backend-${{ matrix.target }}.* tauri-app/src-tauri/bin/ 2>/dev/null || true
          cp dist/yt-dlp-${{ matrix.target }} tauri-app/src-tauri/bin/ || true
          cp dist/yt-dlp-${{ matrix.target }}.* tauri-app/src-tauri/bin/ 2>/dev/null || true
          ls -R tauri-app/src-tauri/bin

      - name: Build desktop installers
        working-directory: tauri-app/src-tauri
        shell: bash
        run: |
          cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.tauri-bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: |
            tauri-app/src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
          body: |
            ## Quran release

            Desktop installers are bundled with the Python backend and yt-dlp sidecars, so you install nothing else.

            - Linux: AppImage and Debian package
            - macOS: DMG
            - Windows: MSI / EXE

            The Flask self-hosting setup remains available as an optional source install for advanced users.
