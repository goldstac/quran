<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nasheed Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-headphones"></i></div>
      <div class="brand-text">
        <span class="brand-name">Nasheed</span>
        <span class="brand-sub">Player</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="search">
        <i class="fa-solid fa-magnifying-glass"></i><span>Search</span>
      </button>
      <button class="nav-item" data-view="library">
        <i class="fa-solid fa-book-open"></i><span>Your Library</span>
      </button>
      <button class="nav-item" data-view="favorites">
        <i class="fa-solid fa-heart"></i><span>Liked Nasheeds</span>
      </button>
      <button class="nav-item" data-view="downloads">
        <i class="fa-solid fa-arrow-down"></i><span>Downloads</span>
      </button>
    </nav>

    <div class="sidebar-sep"></div>

    <div class="sidebar-section">
      <span>Playlists</span>
      <button id="add-pl-btn" class="sidebar-add"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div id="playlist-nav" class="sidebar-playlists"></div>
  </aside>

  <main id="main" class="main">

    <div id="search-view" class="view active">
      <div class="search-sticky">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="What do you want to listen to?">
        </div>
        <div id="search-status" class="search-status"></div>
      </div>
      <div class="search-body">
        <div id="search-empty" class="empty">
          <div class="empty-icon"><i class="fa-solid fa-music"></i></div>
          <p class="empty-title">Search for nasheeds</p>
          <p class="empty-sub">Find and play nasheeds from YouTube</p>
        </div>
        <div id="search-loading" class="empty" style="display:none">
          <div class="spinner"></div>
          <p class="empty-sub">Searching...</p>
        </div>
        <div id="search-results" class="track-list" style="display:none"></div>
      </div>
    </div>

    <div id="library-view" class="view">
      <div class="lib-sticky">
        <h1 id="lib-title" class="lib-title">Your Library</h1>
        <p id="lib-subtitle" class="lib-subtitle"></p>
      </div>
      <div class="lib-body">
        <div id="lib-empty" class="empty" style="display:none">
          <div class="empty-icon"><i class="fa-solid fa-folder-open"></i></div>
          <p class="empty-title">Nothing here yet</p>
          <p class="empty-sub">Search and save nasheeds to see them here</p>
        </div>
        <div id="lib-list" class="track-list" style="display:none"></div>
      </div>
    </div>

  </main>
</div>

<div id="player" class="player">
  <div class="player-left">
    <div class="player-art" id="player-thumb-wrap">
      <img id="player-thumb" style="display:none" alt="">
      <div id="player-thumb-ph" class="player-art-placeholder">
        <i class="fa-solid fa-music"></i>
      </div>
    </div>
    <div class="player-meta">
      <div id="player-title" class="player-title">No track playing</div>
      <div id="player-artist" class="player-artist"></div>
    </div>
    <button id="fav-btn" class="player-fav"><i class="fa-regular fa-heart"></i></button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button id="loop-btn" class="ctrl" title="Loop"><i class="fa-solid fa-repeat"></i></button>
      <button id="prev-btn" class="ctrl" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
      <button id="play-btn" class="play-pause">
        <i id="play-icon" class="fa-solid fa-play"></i>
        <i id="pause-icon" class="fa-solid fa-pause hidden"></i>
      </button>
      <button id="next-btn" class="ctrl" title="Next"><i class="fa-solid fa-forward-step"></i></button>
      <button id="stop-btn" class="ctrl" title="Stop"><i class="fa-solid fa-stop"></i></button>
    </div>
    <div class="player-seek">
      <span id="time-pos" class="time">0:00</span>
      <div class="seek-track"><input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1"></div>
      <span id="time-dur" class="time">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button id="vol-btn" class="ctrl" title="Volume"><i class="fa-solid fa-volume-high"></i></button>
    <div class="vol-track"><input type="range" id="volume-bar" min="0" max="100" value="70"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
